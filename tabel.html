<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G1D viktoriin — tabel</title>
<style>
:root{--ink:#1b2a35;--mute:#5b6b75;--bg:#f4f7f8;--teal:#087e83;--gold:#f2a541}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;display:grid;grid-template-columns:minmax(320px,38%) 1fr;gap:40px;padding:40px}
@media (max-width:800px){body{grid-template-columns:1fr;padding:16px;gap:20px}}
.join{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
h1{font-size:2.4rem}
#qr{background:#fff;padding:18px;border-radius:16px;box-shadow:0 2px 8px #0002}
#qr img,#qr canvas{display:block;width:min(30vw,420px)!important;height:auto!important}
@media (max-width:800px){#qr img,#qr canvas{width:70vw!important}}
.url{color:var(--mute);font-size:1.1rem;word-break:break-all}
.clock{font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal)}
.board h2{font-size:1.8rem;margin-bottom:6px}
.sub{color:var(--mute);font-size:1.2rem;margin-bottom:16px}
ol{list-style:none;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:12px 18px;font-size:1.6rem;font-weight:700}
li .r{width:2.2ch;color:var(--mute)}
li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .s{font-variant-numeric:tabular-nums;color:var(--teal)}
li:nth-child(1) .r{color:var(--gold)}
button{font:inherit;font-size:1.2rem;font-weight:700;padding:12px 22px;border:0;border-radius:12px;background:var(--teal);color:#fff;cursor:pointer}
</style>
</head>
<body>
<section class="join">
  <h1 id="title">Viktoriin</h1>
  <div id="qr"></div>
  <p class="url" id="url"></p>
  <div class="clock" id="clock">5:00</div>
  <button id="go">Käivita kell</button>
</section>
<section class="board">
  <h2>Tabel</h2>
  <p class="sub" id="played">Ootan tulemusi…</p>
  <ol id="list"></ol>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search).get("q") || "";
const join = location.href.replace(/tabel\.html.*$/, "") + "?q=" + encodeURIComponent(q);
$("url").textContent = join;
new QRCode($("qr"), {text: join, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M});
fetch("quizzes/" + encodeURIComponent(q) + ".json").then(r => r.json()).then(d => $("title").textContent = d.title).catch(() => {});

let end = 0, t;
$("go").onclick = () => {
  end = Date.now() + 5 * 60000; clearInterval(t);
  t = setInterval(() => {
    const s = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    $("clock").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    if (!s) clearInterval(t);
  }, 250);
};

async function refresh(){
  const url = (window.VIKTORIIN || {}).scriptUrl;
  if (!url) { $("played").textContent = "Tulemuste leht pole veel ühendatud (config.js)."; return; }
  try {
    const d = await (await fetch(url + "?q=" + encodeURIComponent(q), {cache: "no-store"})).json();
    $("played").textContent = "Mänginud: " + d.played;
    const ol = $("list"); ol.innerHTML = "";
    d.board.slice(0, 10).forEach((r, i) => {
      const li = document.createElement("li");
      li.innerHTML = '<span class="r"></span><span class="n"></span><span class="s"></span>';
      li.children[0].textContent = i + 1; li.children[1].textContent = r.nick; li.children[2].textContent = r.score;
      ol.appendChild(li);
    });
  } catch(e) { $("played").textContent = "Tabelit ei saanud laadida, proovin uuesti…"; }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
